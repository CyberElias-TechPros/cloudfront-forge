name = "creatorloop-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "creator-loop-ring"
AI_PROVIDER = "nvidia"
AI_MODEL = "meta/llama-3.1-8b-instruct"
CORS_ORIGINS = "https://loop.freegameplay.site"
YOUTUBE_OAUTH_CLIENT_ID = ""
YOUTUBE_OAUTH_CLIENT_SECRET = ""
YOUTUBE_OAUTH_REDIRECT_URI = "https://creatorloop-api.autumn-surf-21ec.workers.dev/api/v1/youtube/oauth/callback"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "creatorloop-db"
database_id = "263dfc51-32c0-4973-9e9e-e9c660ebced7"

[[migrations]]
tag = "001_initial_schema"

[[migrations]]
tag = "002_watch_sessions"

[[migrations]]
tag = "003_reputation_columns"

[[migrations]]
tag = "004_youtube_oauth"

# KV Namespaces
[[kv_namespaces]]
binding = "KV_CACHE"
id = "a1a3abb4acf84266add6f7226141ea14"
preview_id = "a1a3abb4acf84266add6f7226141ea14"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "creatorloop-assets"

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
