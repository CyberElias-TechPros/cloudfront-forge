name = "creatorloop-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "c567f93a5269d713595b68c75f8f33c5"

[vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "creator-loop-ring"
AI_PROVIDER = "nvidia"
AI_MODEL = "meta/llama-3.1-8b-instruct"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "creatorloop-db"
database_id = "263dfc51-32c0-4973-9e9e-e9c660ebced7"

[[migrations]]
tag = "001_initial_schema"

[[migrations]]
tag = "002_watch_sessions"

[[migrations]]
tag = "003_reputation_columns"

# KV Namespaces
[[kv_namespaces]]
binding = "KV_CACHE"
id = "a1a3abb4acf84266add6f7226141ea14"
preview_id = "a1a3abb4acf84266add6f7226141ea14"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "creatorloop-assets"

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1