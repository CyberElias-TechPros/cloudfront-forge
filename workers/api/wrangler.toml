name = "creatorloop-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "c567f93a5269d713595b68c75f8f33c5"

[vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "creator-loop-ring"
AI_PROVIDER = "nvidia"
AI_MODEL = "meta/llama-3.1-8b-instruct"
CORS_ORIGINS = "https://loop.freegameplay.site,https://cloudfront-forge.vercel.app"
YOUTUBE_OAUTH_CLIENT_ID = "365634472671-dvmns559uga32703kf2l9vpgbmts38tl.apps.googleusercontent.com"
YOUTUBE_OAUTH_REDIRECT_URI = "https://creatorloop-api.autumn-surf-21ec.workers.dev/api/v1/youtube/oauth/callback"
VAPID_PUBLIC_KEY = "BIfvnJ6Mp68dCFCkywGZlFpPo-hkg6-LeyE0Uz5pZGxOWYejjQFJg_JMxvcRB288LDcK7vAyRMymGJqVEBNpYvk"
REQUIRED_WATCH_SEC = "180"
REWARD_XP = "30"
REWARD_CREDITS = "10"
# Engagement rewards: watch and genuine feedback (comment) each pay points.
# Subscribing is an optional, unpaid support signal (0 points) — paying for
# subscribes is the "sub4sub" pattern that risks YouTube/AdSense standing.
WATCH_REWARD_XP = "10"
WATCH_REWARD_CREDITS = "4"
SUBSCRIBE_REWARD_XP = "0"
SUBSCRIBE_REWARD_CREDITS = "0"
COMMENT_REWARD_XP = "10"
COMMENT_REWARD_CREDITS = "3"
# Cap on how many videos a member can claim watch rewards for per day.
DAILY_CLAIM_LIMIT = "10"
REVIEW_XP = "20"
REVIEW_CREDITS = "5"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "creatorloop-db"
database_id = "263dfc51-32c0-4973-9e9e-e9c660ebced7"

[[migrations]]
tag = "001_initial_schema"

[[migrations]]
tag = "002_watch_sessions"

[[migrations]]
tag = "003_reputation_columns"

[[migrations]]
tag = "004_youtube_oauth"

# KV Namespaces
[[kv_namespaces]]
binding = "KV_CACHE"
id = "a1a3abb4acf84266add6f7226141ea14"
preview_id = "a1a3abb4acf84266add6f7226141ea14"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "creatorloop-assets"

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
