name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck --prefix workers/api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/api
      - name: Frontend tests
        run: npm test
      - name: Worker behavioural and migration tests
        run: npm test --prefix workers/api

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # The API contract (OpenAPI + route inventory + docs/API.md) is generated
  # from the Zod schemas handlers actually validate with. Any change to a
  # request/response shape must be committed here too, otherwise web and
  # Android clients silently drift from the server.
  contract:
    runs-on: ubuntu-latest
    # `contents: read` for checkout, `pull-requests: write` so the spec diff can
    # be posted as a PR comment (PLAT-018).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/api
      - name: Regenerate the contract
        run: npm run contract:build
      - name: Regenerate the API reference
        run: npm run docs:api
      - name: Regenerate the web client types
        run: npm run contract:client
      - name: Fail on drift
        run: |
          git diff --exit-code -- workers/api/src/contract docs/API.md src/contract/api.generated.ts || {
            echo "::error title=Contract is stale::Run 'npm run contract:build && npm run docs:api && npm run contract:client' and commit the result."
            exit 1
          }
      - name: Contract tests
        run: npm --prefix workers/api run test -- tests/contract
      # Two clients ship on independent schedules (web + Android). A removed
      # field or a narrowed enum must be visible in review, not discovered in
      # production, so every PR gets a classified spec diff (PLAT-018).
      - name: Fetch the base branch for the spec diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=50 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: API spec diff
        if: github.event_name == 'pull_request'
        run: |
          node scripts/api-diff.mjs --base "origin/${{ github.base_ref }}" | tee api-diff.md
          cat api-diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the spec diff on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.number }}" --repo "$GITHUB_REPOSITORY" --body-file api-diff.md

  # Cloudflare Workers Builds installs with `bun install --frozen-lockfile`
  # (bun 1.2.15 by default). Dependency changes made through npm used to leave
  # bun.lock stale, which failed every Worker build before it deployed. Catch
  # that here instead. Fix a failure with `npm run lockfile:bun` and commit.
  bun-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: bun.lock matches package.json
        run: bun install --frozen-lockfile --ignore-scripts
