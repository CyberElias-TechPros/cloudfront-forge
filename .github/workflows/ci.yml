name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck --prefix workers/api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/api
      - name: Frontend tests
        run: npm test
      - name: Worker behavioural and migration tests
        run: npm test --prefix workers/api

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # The API contract (OpenAPI + route inventory + docs/API.md) is generated
  # from the Zod schemas handlers actually validate with. Any change to a
  # request/response shape must be committed here too, otherwise web and
  # Android clients silently drift from the server.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/api
      - name: Regenerate the contract
        run: npm run contract:build
      - name: Regenerate the API reference
        run: npm run docs:api
      - name: Regenerate the web client types
        run: npm run contract:client
      - name: Fail on drift
        run: |
          git diff --exit-code -- workers/api/src/contract docs/API.md src/contract/api.generated.ts || {
            echo "::error title=Contract is stale::Run 'npm run contract:build && npm run docs:api && npm run contract:client' and commit the result."
            exit 1
          }
      - name: Contract tests
        run: npm --prefix workers/api run test -- tests/contract

  # Cloudflare Workers Builds installs with `bun install --frozen-lockfile`
  # (bun 1.2.15 by default). Dependency changes made through npm used to leave
  # bun.lock stale, which failed every Worker build before it deployed. Catch
  # that here instead. Fix a failure with `npm run lockfile:bun` and commit.
  bun-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: bun.lock matches package.json
        run: bun install --frozen-lockfile --ignore-scripts
