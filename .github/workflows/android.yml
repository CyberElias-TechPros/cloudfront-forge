name: Android CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "android/**"
      - "scripts/android-client.mjs"
      - "workers/api/src/contract/openapi.generated.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit test and assemble dev debug
        id: gradle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain :core:network-api:testDebugUnitTest :app:testDevDebugUnitTest :app:assembleDevDebug 2>&1 | tee build.log
      - name: Report build failure to PR
        if: failure() && steps.gradle.outcome == 'failure' && github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'android/build.log';
            const log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No build log found';
            const lines = log.split('\n');
            const errors = lines.filter(l => /^e:|error:|FAILED|What went wrong|Execution failed/.test(l)).slice(0, 120).join('\n');
            const tail = lines.slice(-80).join('\n');
            const body = (errors ? 'Errors:\n' + errors + '\n\n' : '') + 'Tail:\n' + tail;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Android build failure:\n```\n' + body.slice(-60000) + '\n```'
            });
      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: loopsquad-dev-debug
          path: android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: warn
