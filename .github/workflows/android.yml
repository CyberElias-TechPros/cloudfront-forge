name: Android CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "android/**"
      - "scripts/android-client.mjs"
      - "workers/api/src/contract/openapi.generated.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit test and assemble dev debug
        run: ./gradlew --no-daemon --stacktrace :core:network-api:testDebugUnitTest :app:testDevDebugUnitTest :app:assembleDevDebug
      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: loopsquad-dev-debug
          path: android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: warn
